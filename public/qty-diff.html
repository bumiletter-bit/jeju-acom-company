<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중간발주 추가 포장 수량</title>
<!-- #1002(대표 11/3): ①앞 중간발주 그림 ②뒤 그림을 넣으면 더 포장할 수량만 그림으로.
     그림 읽기 = POST /api/public/qty-read(서버 저장 0) · 차이 계산·그림 그리기는 이 브라우저 안. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --font-app:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --primary:#4F46E5; --primary-dark:#4338CA; --primary-light:#EEF0FF; --primary-ring:rgba(79,70,229,.15);
  --page-bg:#E9EBF0; --card-border:#DFE2E8; --border:#ECEDF1;
  --text-dark:#101828; --text-mid:#667085; --text-on-page:#545D70;
  --danger:#D92D20; --danger-bg:#FEF3F2; --ok:#067647;
  --shadow-card:0 1px 2px rgba(16,24,40,.06),0 2px 6px -2px rgba(16,24,40,.10);
  --g-lemon:#E6F2D3; --g-hgh:#FFF0BF; --g-nhgh:#FFE2C2; --g-saek:#FDE3D6; --g-yura:#DCEAFB; --g-etc:#EEF0F4;
  --tail:#C2410C;
  --tang:#D9570B; --tang-dark:#B8470A; --tang-ring:rgba(217,87,11,.18); --cream:#FDF5DC; --cream-line:#F1E2B8; --cream-ink:#6B4A12;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page-bg);color:var(--text-dark);font-family:var(--font-app);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 48px}
.hero{display:flex;align-items:flex-end;gap:12px;background:var(--cream);border:1px solid var(--cream-line);border-radius:16px;padding:14px 16px 0;margin-bottom:14px;overflow:hidden}
.hero .tx{flex:1;min-width:0;padding-bottom:14px;align-self:center}
.hero img{flex:none;width:84px;height:auto;display:block}
h1{font-size:21px;margin:0 0 4px;letter-spacing:-.01em;word-break:keep-all}
.lead{color:var(--cream-ink);margin:0;font-size:14px;word-break:keep-all}
@media (min-width:561px){.hero img{width:104px}h1{font-size:24px}.lead{font-size:15px}}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.slots{grid-template-columns:1fr}}
.slot{background:#fff;border:1px solid var(--card-border);border-radius:14px;box-shadow:var(--shadow-card);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.step-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.step-h .no{flex:none;width:28px;height:28px;border-radius:999px;background:var(--tang);color:#fff;display:grid;place-items:center;font-size:15px}
.step-h small{font-weight:500;color:var(--text-mid);font-size:13px}
.drop{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;min-height:120px;border:2px dashed #EBC98A;border-radius:12px;background:#FFFBF0;cursor:pointer;padding:10px;text-align:center;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--tang);background:var(--cream)}
.drop:focus-within{outline:3px solid var(--tang-ring);outline-offset:2px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop .ph{font-weight:700;font-size:15px;color:var(--tang-dark)}
.drop .ph small{display:block;font-weight:500;color:var(--text-mid);font-size:13px;margin-top:2px}
.drop img.th{max-height:96px;max-width:40%;border-radius:8px;border:1px solid var(--card-border);object-fit:contain;background:#fff}
.drop.has .ph{font-size:14px}
.st{font-size:14px;min-height:21px;color:var(--text-on-page);overflow-wrap:anywhere}
.st.ok{color:var(--ok);font-weight:700}
.st.err{color:var(--danger);font-weight:700}
.st .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--primary-ring);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.st .spin{animation:none}}
details.txt{margin-top:12px;font-size:14px;color:var(--text-on-page)}
details.txt summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
details.txt .tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){details.txt .tg{grid-template-columns:1fr}}
details.txt textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--card-border);border-radius:10px;padding:8px;font:13px/1.45 var(--font-app);color:var(--text-dark);background:#fff}
textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.result{margin-top:16px}
.note{max-width:720px;margin:0 auto 10px;padding:9px 14px;border-radius:12px;background:var(--cream);border:1px solid var(--cream-line);color:var(--cream-ink);font-size:14px;font-weight:700;word-break:keep-all}
.warn{background:var(--danger-bg);color:var(--danger);border:1px solid #FECDCA;border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px;margin-bottom:10px}
.warn div+div{margin-top:4px}
.empty{color:var(--text-on-page);text-align:center;padding:24px 8px;font-size:15px}
.out{display:block;width:100%;max-width:720px;margin:0 auto;border-radius:14px;box-shadow:var(--shadow-card);background:#fff;-webkit-touch-callout:default;user-select:auto}
.dl{display:block;width:100%;max-width:720px;margin:12px auto 0;min-height:52px;border:0;border-radius:12px;background:var(--tang);color:#fff;font:800 17px var(--font-app);cursor:pointer;box-shadow:0 6px 16px -6px rgba(217,87,11,.55);transition:transform .12s cubic-bezier(.23,1,.32,1)}
.acts{display:flex;gap:8px;max-width:720px;margin:0 auto 12px}
.acts .dl{flex:1 1 auto;margin:0}
.rs{flex:0 0 auto;min-height:52px;min-width:96px;padding:0 18px;border:1px solid var(--cream-line);border-radius:12px;background:#fff;color:var(--cream-ink);font:700 16px var(--font-app);cursor:pointer;transition:transform .12s cubic-bezier(.23,1,.32,1)}
.rs:hover{border-color:var(--tang);color:var(--tang-dark)}
.rs:active{transform:scale(.97)}
.rs:focus-visible{outline:3px solid var(--tang-ring);outline-offset:2px}
.acts.solo{justify-content:center}
.dl:hover{background:var(--tang-dark)}
.dl:active{transform:scale(.97)}
.dl:focus-visible{outline:3px solid var(--tang-ring);outline-offset:2px}
.hint{text-align:center;color:var(--text-on-page);font-size:13px;margin-top:8px}

/* ===== 그림으로 그릴 표(화면 밖에서 그려 <img> 로) ===== */
#stage{position:fixed;left:-10000px;top:0;width:720px}
#sheet{background:#fff;width:720px;font-family:var(--font-app);color:var(--text-dark)}
.sh-head{display:flex;align-items:flex-end;gap:14px;background:var(--cream);padding:18px 22px 0;border-bottom:3px solid var(--tang)}
.sh-head img{flex:none;width:132px;height:auto;display:block}
.sh-head .tx{flex:1;min-width:0;padding-bottom:16px}
.sh-title{font-size:27px;font-weight:800;letter-spacing:-.01em;line-height:1.25;word-break:keep-all}
.sh-total{display:flex;align-items:baseline;gap:12px;margin-top:10px;font-size:22px;font-weight:800;color:var(--cream-ink)}
.sh-total .v{font-size:54px;line-height:1;color:var(--tang);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.sh-total .v small{font-size:26px;margin-left:2px}
.sh-sub{font-size:16px;color:var(--cream-ink);margin-top:8px;font-weight:600}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;font-weight:800;font-size:20px;border-top:2px solid rgba(16,24,40,.28);box-shadow:inset 0 -1px 0 rgba(16,24,40,.12)}
.grp-h .s{font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid rgba(16,24,40,.08)}
.row .nm{flex:1;min-width:0;font-size:22px;font-weight:600;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.row .nm .tail{color:var(--tail);font-weight:800}
.row .nm .chk{display:inline-block;font-size:14px;font-weight:800;color:#fff;background:var(--danger);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:3px}
.row .nm .new{display:inline-block;font-size:14px;font-weight:800;color:#fff;background:var(--primary);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:3px}
.row .q{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.row .q small{display:block;font-size:14px;font-weight:600;color:var(--text-mid);line-height:1.2}
.dec{padding:12px 18px 14px;border-top:2px dashed var(--card-border);background:#FAFAFB}
.dec h3{margin:0 0 6px;font-size:16px;color:var(--text-mid)}
.dec .r{display:flex;gap:8px;font-size:16px;color:var(--text-mid);padding:2px 0}
.dec .r span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.dec .r b{color:var(--danger);font-variant-numeric:tabular-nums}
.sh-none{padding:28px 18px;text-align:center;font-size:20px;font-weight:700;color:var(--text-mid)}
.sh-foot{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:10px 18px 12px;font-size:15px;font-weight:800;color:var(--cream-ink);background:var(--cream);border-top:1px solid var(--cream-line)}
.sh-foot::before{content:'';width:10px;height:10px;border-radius:999px;background:var(--tang)}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero"><div class="tx"><h1>중간발주 추가 포장 수량</h1>
  <p class="lead">① 먼저 보낸 중간발주 그림, ② 지금 그림을 넣으면 더 포장할 수량만 그림으로 나와요. 결과 그림을 길게 눌러 저장하거나 보내면 돼요.</p></div><img src="qty-akkomi.webp" alt="" width="300" height="481"></header>

  <div class="slots">
    <section class="slot" data-k="A">
      <div class="step-h"><span class="no">1</span>앞 그림<small>먼저 보낸 것</small></div>
      <label class="drop" id="drop-A"><input type="file" accept="image/*" id="file-A" aria-label="앞 그림 넣기"><span class="ph">그림 넣기<small>사진 고르기 · 붙여넣기 · 끌어 놓기</small></span></label>
      <div class="st" id="st-A" role="status" aria-live="polite"></div>
    </section>
    <section class="slot" data-k="B">
      <div class="step-h"><span class="no">2</span>뒤 그림<small>지금 보낼 것</small></div>
      <label class="drop" id="drop-B"><input type="file" accept="image/*" id="file-B" aria-label="뒤 그림 넣기"><span class="ph">그림 넣기<small>사진 고르기 · 붙여넣기 · 끌어 놓기</small></span></label>
      <div class="st" id="st-B" role="status" aria-live="polite"></div>
    </section>
  </div>

  <details class="txt" id="txt">
    <summary>그림 대신 글로 넣기(엑셀 「품목 이름 | 수량」 복사)</summary>
    <div class="tg">
      <textarea id="ta-A" aria-label="앞 표 글" placeholder="① 앞 표"></textarea>
      <textarea id="ta-B" aria-label="뒤 표 글" placeholder="② 뒤 표"></textarea>
    </div>
  </details>

  <div class="result" id="result" aria-live="polite"><div class="empty">③ 두 그림을 넣으면 여기에 차이 그림이 나와요.</div></div>
</div>
<div id="stage" aria-hidden="true"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var READ_URL = '/api/public/qty-read';
  var MAX_SIDE = 1568;   // AI 가 보는 최대 긴 변 · 작은 그림(엑셀 캡처 폭 500~650)은 여기까지 키워 보냄(최대 3배)

  // ===== 글 → 줄 =====
  function norm(s) { return String(s == null ? '' : s).normalize('NFKC').replace(/[ ​﻿]/g, ' ').replace(/\s+/g, ' ').trim(); }
  // 짝 맞추는 열쇠 = 띄어쓰기·물결·줄표 꼴 차이 무시(그림 읽기가 장마다 조금씩 다르게 옮겨도 같은 줄로)
  function key(s) { return norm(s).toLowerCase().replace(/\s+/g, '').replace(/[∼〜～]/g, '~').replace(/[‐-―−]/g, '-'); }
  function tsvRows(text) {
    var rows = [], row = [], cell = '', i = 0, s = String(text || ''), q = false;
    while (i < s.length) {
      var c = s[i];
      if (q) { if (c === '"') { if (s[i + 1] === '"') { cell += '"'; i += 2; continue; } q = false; i++; continue; } cell += (c === '\r' || c === '\n') ? ' ' : c; i++; continue; }
      if (c === '"' && cell === '') { q = true; i++; continue; }
      if (c === '\t') { row.push(cell); cell = ''; i++; continue; }
      if (c === '\r' || c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; if (c === '\r' && s[i + 1] === '\n') i++; i++; continue; }
      cell += c; i++;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  function toQty(v) { var t = norm(v).replace(/개|박스|box$/i, '').trim(); if (!/^-?(\d{1,3}(,\d{3})+|\d+)(\.0+)?$/.test(t)) return null; return parseInt(t.replace(/,/g, ''), 10); }
  var TOTAL_NAME = /^(합\s*계|총\s*합?\s*계?|소\s*계|계|합|total|sum)\s*[:：]?$/i;
  function parseText(text) {
    var items = [], skipped = 0;
    tsvRows(text).forEach(function (cells) {
      if (!cells.some(function (c) { return norm(c); })) return;
      var name, qty;
      if (cells.length >= 2) {
        var qi = -1; for (var i = 0; i < cells.length; i++) if (toQty(cells[i]) !== null) { qi = i; break; }
        if (qi < 0) { skipped++; return; }
        name = norm(cells.slice(0, qi).join(' ')); if (!name) return; qty = toQty(cells[qi]);
      } else {
        var m = norm(cells[0]).match(/^(.*\S)\s+(-?[\d,]+(?:\.0+)?)$/);
        if (!m) { if (toQty(cells[0]) !== null) return; skipped++; return; }
        name = norm(m[1]); qty = toQty(m[2]); if (qty === null) { skipped++; return; }
      }
      if (TOTAL_NAME.test(name)) return;
      items.push({ name: name, qty: qty });
    });
    return { items: items, skipped: skipped };
  }

  // ===== 앞·뒤 → 차이 =====
  function toMap(items) {
    var m = new Map(), order = [];
    items.forEach(function (x) { var k = key(x.name); if (!k) return; if (!m.has(k)) { m.set(k, { name: norm(x.name), qty: 0, check: false }); order.push(k); } m.get(k).qty += x.qty; if (x.check) m.get(k).check = true; });
    return { m: m, order: order };
  }
  function diffItems(aItems, bItems) {
    var A = toMap(aItems), B = toMap(bItems);
    // 칸이 잘려 이름 뒤가 빠진 그림 = 한쪽 열쇠가 다른 쪽의 앞부분이고 짝이 하나뿐이면 같은 줄로
    var aLeft = A.order.filter(function (k) { return !B.m.has(k); }), bLeft = B.order.filter(function (k) { return !A.m.has(k); });
    bLeft.forEach(function (bk) {
      if (bk.length < 12) return;
      var hits = aLeft.filter(function (ak) { return ak.length >= 12 && (ak.indexOf(bk) === 0 || bk.indexOf(ak) === 0); });
      if (hits.length !== 1) return;
      var ak = hits[0], bHits = bLeft.filter(function (k) { return k.length >= 12 && (ak.indexOf(k) === 0 || k.indexOf(ak) === 0); });
      if (bHits.length !== 1) return;
      var a = A.m.get(ak), b = B.m.get(bk);
      var longer = a.name.length > b.name.length ? a.name : b.name;
      A.m.delete(ak); A.m.set(bk, { name: longer, qty: a.qty }); A.order[A.order.indexOf(ak)] = bk; b.name = longer;
      aLeft.splice(aLeft.indexOf(ak), 1);
    });
    var rows = [];
    B.order.forEach(function (k) { var b = B.m.get(k), a = A.m.get(k); rows.push({ name: b.name, a: a ? a.qty : 0, b: b.qty, isNew: !a, check: b.check || !!(a && a.check) }); });
    A.order.forEach(function (k) { if (!B.m.has(k)) { var a = A.m.get(k); rows.push({ name: a.name, a: a.qty, b: 0, isNew: false, check: a.check }); } });
    return rows;
  }

  var GROUPS = [
    { key: 'lemon', label: '레몬(그린레몬)', bg: 'var(--g-lemon)', test: function (n) { return /레몬/.test(n); } },
    { key: 'nhgh', label: '노지 황금향', bg: 'var(--g-nhgh)', test: function (n) { return /노지\s*황금향/.test(n); } },
    { key: 'hgh', label: '황금향', bg: 'var(--g-hgh)', test: function (n) { return /황금향/.test(n); } },
    { key: 'yura', label: '유라 노지감귤', bg: 'var(--g-yura)', test: function (n) { return /유라/.test(n); } },
    { key: 'saek', label: '노지감귤(새콤달콤)', bg: 'var(--g-saek)', test: function (n) { return /새콤달콤|노지\s*감귤/.test(n); } }
  ];
  var SHOW_ORDER = ['lemon', 'hgh', 'nhgh', 'saek', 'yura'];
  function groupOf(n) {
    for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].test(n)) return GROUPS[i];
    var head = n.split('/')[0].trim() || n;
    return { key: 'etc:' + head, label: head, bg: 'var(--g-etc)' };
  }
  function shortName(n) { var m = n.match(/(?:상품\s*및\s*과수|과수\s*및\s*크기)\s*:\s*(.+)$/); return m ? m[1] : n; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function nameHtml(n) { return esc(n).replace(/(\S*(?:사이즈로|과로)!?)\s*$/, '<span class="tail">$1</span>'); }

  function sheetHtml(rows, at, bt) {
    var inc = [], dec = [];
    rows.forEach(function (r) { var d = r.b - r.a; if (d > 0) inc.push({ name: r.name, a: r.a, b: r.b, d: d, isNew: r.isNew, check: r.check }); else if (d < 0) dec.push({ name: r.name, a: r.a, b: r.b, d: d, check: r.check }); });
    var groups = new Map();
    inc.forEach(function (x) { var g = groupOf(x.name); if (!groups.has(g.key)) groups.set(g.key, { g: g, rows: [], sum: 0 }); var e = groups.get(g.key); e.rows.push(x); e.sum += x.d; });
    var keys = Array.from(groups.keys()).sort(function (a, b) { var ia = SHOW_ORDER.indexOf(a), ib = SHOW_ORDER.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
    var total = inc.reduce(function (s, x) { return s + x.d; }, 0);
    var h = '<div id="sheet"><div class="sh-head"><img src="qty-akkomi.webp" alt=""><div class="tx"><div class="sh-title">포장해야 할 차이 수량입니다</div><div class="sh-total"><span>추가 포장</span><span class="v">' + total + '<small>박스</small></span></div>'
      + '<div class="sh-sub">앞 ' + at + '박스 → 지금 ' + bt + '박스</div></div></div>';
    if (!inc.length) h += '<div class="sh-none">늘어난 품목이 없어요</div>';
    keys.forEach(function (k) {
      var e = groups.get(k);
      h += '<div class="grp-h" style="background:' + e.g.bg + '"><span>' + esc(e.g.label) + '</span><span class="s">' + e.sum + '박스</span></div>';
      e.rows.forEach(function (x) {
        h += '<div class="row" style="background:' + e.g.bg + '"><div class="nm">' + nameHtml(shortName(x.name)) + (x.isNew ? '<span class="new">새 품목</span>' : '') + (x.check ? '<span class="chk">이름 확인</span>' : '') + '</div>'
          + '<div class="q">+' + x.d + '<small>' + x.a + '→' + x.b + '</small></div></div>';
      });
    });
    if (dec.length) {
      h += '<div class="dec"><h3>줄어든 것(취소 등) · 포장 수량에서 빼 주세요</h3>';
      dec.forEach(function (x) { h += '<div class="r"><span>' + esc(shortName(x.name)) + '</span><b>' + x.d + '</b><span>(' + x.a + '→' + x.b + ')</span></div>'; });
      h += '</div>';
    }
    return { html: h + '<div class="sh-foot">제주아꼼이네</div></div>', total: total, inc: inc.length, dec: dec.length };
  }

  // ===== 그림 넣기 · 읽기 =====
  var S = { A: { seq: 0, img: null }, B: { seq: 0, img: null } };   // img = { items, total, readSum, mismatch }
  function setSt(k, html, cls) { var el = $('st-' + k); el.className = 'st' + (cls ? ' ' + cls : ''); el.innerHTML = html; }
  function shrink(file) {
    return new Promise(function (ok, no) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var r = Math.min(3, MAX_SIDE / Math.max(im.naturalWidth, im.naturalHeight));
        var w = Math.max(1, Math.round(im.naturalWidth * r)), h = Math.max(1, Math.round(im.naturalHeight * r));
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);
        URL.revokeObjectURL(url); ok({ data: cv.toDataURL('image/jpeg', 0.9), thumb: cv.toDataURL('image/jpeg', 0.6) });
      };
      im.onerror = function () { URL.revokeObjectURL(url); no(new Error('그림 파일이 아니에요')); };
      im.src = url;
    });
  }
  function takeFile(k, file) {
    if (!file) return;
    if (!/^image\//.test(file.type || '')) { setSt(k, '그림 파일이 아니에요. 다시 넣어 주세요.', 'err'); return; }
    var my = ++S[k].seq; S[k].img = null; S[k].used = true; render();
    setSt(k, '<span class="spin"></span>그림 읽는 중…');
    shrink(file).then(function (g) {
      if (my !== S[k].seq) return;
      var drop = $('drop-' + k); drop.classList.add('has');
      var th = drop.querySelector('img.th'); if (!th) { th = document.createElement('img'); th.className = 'th'; th.alt = ''; drop.insertBefore(th, drop.querySelector('.ph')); }
      th.src = g.thumb; drop.querySelector('.ph').innerHTML = '다른 그림으로 바꾸기<small>누르거나 붙여넣기</small>';
      var t0 = Date.now();
      return fetch(READ_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: g.data }) })
        .then(function (r) { return r.json().catch(function () { return { ok: false }; }).then(function (j) { j._status = r.status; return j; }); })
        .then(function (j) {
          if (my !== S[k].seq) return;
          if (!j || !j.ok) { setSt(k, esc((j && j.error) || '읽기에 실패했어요. 다시 넣어 주세요.'), 'err'); return; }
          S[k].img = { items: j.items, total: j.total, readSum: j.read_sum, mismatch: !!j.mismatch };
          var sec = Math.round((Date.now() - t0) / 100) / 10;
          if (j.mismatch) setSt(k, '읽기 확인 필요: 읽은 합 ' + j.read_sum + ' · 그림 합계 ' + j.total, 'err');
          else setSt(k, j.items.length + '줄 · ' + j.read_sum + '박스 읽음' + (j.total === null ? '(그림에 합계 없음)' : ' ✓') + ' · ' + sec + '초', j.total === null ? '' : 'ok');
          render();
        });
    }).catch(function (e) { if (my === S[k].seq) setSt(k, esc(e.message || '읽기에 실패했어요') + '. 다시 넣어 주세요.', 'err'); });
  }
  ['A', 'B'].forEach(function (k) {
    var inp = $('file-' + k), drop = $('drop-' + k);
    inp.addEventListener('change', function () { takeFile(k, inp.files && inp.files[0]); inp.value = ''; });
    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
    drop.addEventListener('drop', function (e) { e.preventDefault(); drop.classList.remove('over'); takeFile(k, e.dataTransfer.files && e.dataTransfer.files[0]); });
    $('ta-' + k).addEventListener('input', render);
  });
  var DROP_PH = '그림 넣기<small>사진 고르기 · 붙여넣기 · 끌어 놓기</small>';
  function anyInput() { return !!(S.A.used || S.B.used || norm($('ta-A').value) || norm($('ta-B').value)); }
  function resetAll() {
    ['A', 'B'].forEach(function (k) {
      S[k].seq++; S[k].img = null; S[k].used = false;   // seq 는 계속 올라감 = 읽는 중이던 응답은 늦게 와도 번호가 달라 버려짐
      var drop = $('drop-' + k), th = drop.querySelector('img.th'); if (th) th.remove();
      drop.classList.remove('has', 'over'); drop.querySelector('.ph').innerHTML = DROP_PH;
      $('file-' + k).value = ''; $('ta-' + k).value = ''; setSt(k, '');
    });
    $('txt').open = false; $('stage').innerHTML = ''; ++drawSeq; lastFocus = null;
    $('result').innerHTML = '<div class="empty">③ 두 그림을 넣으면 여기에 차이 그림이 나와요.</div>';
    try { window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); } catch (_) { window.scrollTo(0, 0); }
  }
  function bindReset() { var b = $('btn-rs'); if (b) b.addEventListener('click', resetAll); }
  var lastFocus = null;
  ['A', 'B'].forEach(function (k) { $('drop-' + k).addEventListener('pointerdown', function () { lastFocus = k; }); });
  document.addEventListener('paste', function (e) {
    if (e.target && e.target.tagName === 'TEXTAREA') return;
    var f = null, it = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < it.length; i++) if (it[i].kind === 'file' && /^image\//.test(it[i].type)) { f = it[i].getAsFile(); break; }
    if (!f) return;
    e.preventDefault();
    var k = lastFocus || (!S.A.used ? 'A' : 'B');
    lastFocus = null; takeFile(k, f);
  });

  // 한쪽 = 글이 있으면 글, 없으면 그림
  function side(k) {
    var t = $('ta-' + k).value;
    if (norm(t)) { var p = parseText(t); return p.items.length ? { items: p.items, total: null, mismatch: false, text: true, skipped: p.skipped } : null; }
    return S[k].img;
  }
  // [이미지 다운로드] = PNG 내려받기 · 아이폰은 공유 창(「이미지 저장」 = 사진 앱)으로
  function fileName() { var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; }; return '추가포장_' + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + '.png'; }
  function download(cv, png) {
    var name = fileName();
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.canShare) {
      cv.toBlob(function (bl) {
        var f = bl && new File([bl], name, { type: 'image/png' });
        if (f && navigator.canShare({ files: [f] })) navigator.share({ files: [f] }).catch(function () { });
        else plain();
      }, 'image/png');
      return;
    }
    plain();
    function plain() { var a = document.createElement('a'); a.download = name; a.href = png; document.body.appendChild(a); a.click(); a.remove(); }
  }
  var drawSeq = 0;
  function render() {
    var a = side('A'), b = side('B'), out = $('result');
    if (!a || !b) { ++drawSeq; out.innerHTML = (anyInput() ? '<div class="acts solo"><button type="button" class="rs" id="btn-rs">초기화</button></div>' : '') + '<div class="empty">③ 두 그림을 넣으면 여기에 차이 그림이 나와요.</div>'; bindReset(); return; }
    var my = ++drawSeq;
    var at = a.items.reduce(function (s, x) { return s + x.qty; }, 0), bt = b.items.reduce(function (s, x) { return s + x.qty; }, 0);
    // 1번이 더 많으면(순서를 거꾸로 넣음) 큰 쪽을 「지금」으로 보고 계산 · 합계가 같으면 그대로
    var note = '';
    if (at > bt) { note = '1번 그림이 더 많아서 1번 기준으로 계산했어요(1번 ' + at + ' · 2번 ' + bt + ')'; var sw = a; a = b; b = sw; var st = at; at = bt; bt = st; }
    var s = sheetHtml(diffItems(a.items, b.items), at, bt);
    var warn = [];
    var unsure = []; [a, b].forEach(function (sd) { sd.items.forEach(function (x) { if (x.check && unsure.indexOf(x.name) < 0) unsure.push(x.name); }); });
    if (unsure.length) warn.push('이름 확인 필요 ' + unsure.length + '줄(그림 속 「이름 확인」 줄): ' + unsure.slice(0, 3).join(' · ') + (unsure.length > 3 ? ' …' : ''));
    // 한 그림 안에 같은 이름 줄이 둘 이상 = 꼬리(…사이즈로!)가 잘려 합쳐졌을 수 있음 → 합쳐서 셈 · 알림
    [[note ? '2번' : '앞', a], [note ? '1번' : '지금', b]].forEach(function (p) { if (p[1].text) return; var seen = {}, dup = []; p[1].items.forEach(function (x) { var k = key(x.name); if (seen[k] && dup.indexOf(x.name) < 0) dup.push(x.name); seen[k] = 1; }); if (dup.length) warn.push('읽기 확인 필요(' + p[0] + ' 그림): 같은 이름 줄이 여럿이라 합쳐 셌어요(사이즈 꼬리가 잘렸을 수 있음) · ' + dup.map(shortName).slice(0, 2).join(' · ')); });
    [[note ? '2번' : '앞', a], [note ? '1번' : '지금', b]].forEach(function (p) { if (p[1].mismatch) warn.push('읽기 확인 필요(' + p[0] + ' 그림): 읽은 합 ' + p[1].readSum + ' · 그림 합계 ' + p[1].total); if (p[1].skipped) warn.push(p[0] + ' 글에서 못 읽은 줄 ' + p[1].skipped + '개'); });
    var stage = $('stage'); stage.innerHTML = s.html;
    out.innerHTML = '<div class="empty"><span class="st"><span class="spin"></span></span>차이 그림 만드는 중…</div>';
    var go = function () {
      if (typeof html2canvas !== 'function') return Promise.reject(new Error('그림 도구를 못 불러왔어요(인터넷 확인)'));
      return html2canvas($('sheet'), { scale: 1.5, backgroundColor: '#ffffff', logging: false, windowWidth: 760 });
    };
    var imgsReady = function () { return Promise.all(Array.prototype.map.call(stage.querySelectorAll('img'), function (im) { return im.complete ? 0 : new Promise(function (r) { im.onload = im.onerror = r; }); })); };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(imgsReady).then(go).then(function (cv) {
      if (my !== drawSeq) return;
      var h = (note ? '<div class="note">' + esc(note) + '</div>' : '') + (warn.length ? '<div class="warn" role="alert">' + warn.map(function (w) { return '<div>' + esc(w) + '</div>'; }).join('') + '</div>' : '')
        + '<div class="acts"><button type="button" class="dl" id="btn-dl">이미지 다운로드</button><button type="button" class="rs" id="btn-rs">초기화</button></div>'
        + '<img class="out" id="out-img" alt="추가 포장 ' + s.total + '박스 차이 표">'
        + '<div class="hint">그림을 길게 눌러 저장·공유해도 돼요</div>';
      out.innerHTML = h; var png = cv.toDataURL('image/png'); $('out-img').src = png;
      $('btn-dl').addEventListener('click', function () { download(cv, png); }); bindReset();
      try { $('btn-dl').scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); } catch (_) { }
    }).catch(function (e) { if (my === drawSeq) out.innerHTML = '<div class="warn">' + esc(e.message) + '</div>'; });
  }

  window.__qtyDiff = { parseText: parseText, diffItems: diffItems, groupOf: groupOf, key: key, state: S };   // 검증용(읽기만)

  // 지난판(v5.9.696) 거래처 링크 #v1.… 는 이제 만들지 않음 → 열리면 안내만
  if (/^#v1\./.test(location.hash)) $('result').innerHTML = '<div class="warn">이 링크는 이제 쓰지 않아요. 차이 그림을 받아 주세요.</div>';
})();
</script>
</body>
